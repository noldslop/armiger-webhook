# Woodpecker CI: build and push the armiger-webhook image to the local registry.
# reg.dc (trow) accepts anonymous pushes, so no registry credentials are needed.
build:
  steps:
    - name: build-and-push
      image: woodpeckerci/plugin-docker-buildx
      settings:
        repos:
          - reg.dc/noldslop/armiger-webhook
        tags:
          - latest
        # Pin the armiger commit the image is built from (override per-PR if needed).
        build_args:
          - ARMIGER_REF=02b77e82ac07cac961ac7182e2310d133f97368d
  when:
    event: push
    branch: main
